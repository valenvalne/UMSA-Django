<!-- CHATBOT UMSA -->
<div class="chatbot">
  <button class="chatbot-toggle" type="button" id="chatbot-toggle" aria-label="Abrir asistente UMSA">
    💬
  </button>

  <div class="chatbot-window" id="chatbot-window" hidden>
    <div class="chatbot-header">
      <div>
        <strong>Asistente UMSA</strong>
        <small>Atención y orientación</small>
      </div>
      <button type="button" id="chatbot-close" aria-label="Cerrar chatbot">×</button>
    </div>

    <div class="chatbot-messages" id="chatbot-messages">
      <div class="chatbot-message bot">
        👋 Hola, soy el asistente de UMSA. ¿En qué puedo ayudarte?
      </div>

      <div class="chatbot-options">
        <button type="button" data-chat-option="turno">📅 Solicitar un turno</button>
        <button type="button" data-chat-option="consulta">🔎 Consultar un turno</button>
        <button type="button" data-chat-option="especialidades">🩺 Especialidades</button>
        <button type="button" data-chat-option="profesionales">👩‍⚕️ Profesionales</button>
        <button type="button" data-chat-option="faq">❓ Preguntas frecuentes</button>
        <button type="button" data-chat-option="contacto">📍 Contacto</button>
        <button type="button" data-chat-option="nosotros">🏥 Quiénes somos</button>
      </div>
    </div>
  </div>
</div>
