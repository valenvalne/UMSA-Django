{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UMSA Centro Médico - Apostá a la vida. San Andrés de Giles. Solicitud y consulta de turnos médicos."
    />
    <title>{% block title %}UMSA - Centro Médico | Apostá a la vida{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'medico/img/favicon.svg' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Franklin:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'medico/css/styles.css' %}" />
    <link rel="stylesheet" href="{% static 'medico/css/opiniones.css' %}" />
    <script src="{% static 'medico/js/app.js' %}" defer></script>
    <script src="{% static 'medico/js/opiniones.js' %}" defer></script>
  </head>
  <body>
    {% block content %}
    {% endblock %}
  </body>
</html>
